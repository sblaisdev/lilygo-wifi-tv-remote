name: Build & Publish Release Firmware

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO Core
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build Firmware for LilyGO T-Dongle-S3
        run: pio run -e t-dongle-s3

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-t-dongle-s3
          path: .pio/build/t-dongle-s3/firmware.bin

      - name: Upload Release Asset (firmware.bin)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/t-dongle-s3/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
